# GENERATED — from weaver's template/repo/.github/workflows/ci.yml.
# Fix it there and re-run `npm run provider -- stripe`; an edit here is
# destroyed by the next protocol sync.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Runnable BY HAND, which is not a convenience. google-sheets was created,
  # pushed to twice and opened a pull request against, and GitHub fired no
  # workflow at all — while `workflow_dispatch` worked immediately on the same
  # repo. CI passing is the gate before publishing, so a CI nobody can start is
  # a provider nobody can ship.
  workflow_dispatch:

# The publish token is never available here. `publish.yml` triggers on tags only,
# and a `pull_request` run can execute a fork's code — with a scope-wide npm
# token that reaches every @particle-academy package, react-fancy included.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated:
    name: nothing under packages/ was hand-edited
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The generated-code rule WILL be violated by someone in a hurry, and a
      # hand-edit is destroyed by the next protocol sync — so failing here is
      # the kind outcome.
      #
      # Verified against `.weaver.json`, which weaver emitted beside every other
      # file. NOT by checking out weaver and regenerating: weaver.agi is
      # PRIVATE, and this repo's `github.token` cannot read a different private
      # repo — that job failed at checkout and so enforced nothing at all.
      #
      # This answers the question that belongs HERE: did somebody edit packages/
      # in this repo. Whether this repo is STALE against a newer template is
      # weaver's question, and weaver's own CI is the only place with both halves.
      - name: Verify the integrity manifest
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const fs = require("node:fs");

            const manifest = JSON.parse(fs.readFileSync(".weaver.json", "utf8"));
            const problems = [];

            for (const [file, expected] of Object.entries(manifest.files)) {
              if (!fs.existsSync(file)) {
                problems.push("missing:  " + file);
                continue;
              }

              const actual = createHash("sha256")
                .update(fs.readFileSync(file, "utf8"), "utf8")
                .digest("hex");

              if (actual !== expected) problems.push("modified: " + file);
            }

            if (problems.length) {
              console.error("::error::" + problems.length + " generated file(s) differ from what weaver emitted");
              for (const problem of problems) console.error("  " + problem);
              console.error("");
              console.error("Fix provider/ — or weavers template/ — and regenerate:");
              console.error("    npm run provider -- stripe");
              process.exit(1);
            }

            console.log(Object.keys(manifest.files).length + " generated files match .weaver.json");
          '

  allowlist:
    name: third-party allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # FETCHED, never vendored: one source, no copies to drift. Checked out
      # rather than curled, because the checker reads its allowlist from beside
      # itself — this is the form every kit repo already uses. PINNED to a commit
      # and hash-verified (pin-github-checks.mjs, fancy.agi), so an allowlist
      # change reaches these repos when it is re-pinned and swept, not on push.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v5
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ''
          NODE_PATH: ''
          BASH_ENV: ''
          ENV: ''
          SHELLOPTS: ''
          BASHOPTS: ''
          LD_PRELOAD: ''
          LD_LIBRARY_PATH: ''
          LD_AUDIT: ''
          DYLD_INSERT_LIBRARIES: ''
          DYLD_LIBRARY_PATH: ''
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      # Covers all four packages at once: npm dependencies, Composer require,
      # and the Python project table. A vendor SDK cannot arrive unnoticed.
      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

  npm:
    # QUOTED. Every npm package here starts with "@", and an unquoted plain
    # scalar cannot begin with a YAML indicator character -- GitHub rejects the
    # whole file with "a workflow file issue" and no line number.
    name: "@particle-academy/stripe-ui + @particle-academy/stripe-js"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # From the ROOT, so the npm workspace links packages/ui into packages/js.
      # `@particle-academy/stripe-js` depends on `@particle-academy/stripe-ui` by its PUBLISHED name, because that
      # is what a consumer installs — and until the first successful publish,
      # that name does not resolve on the registry. Installing per-package would
      # therefore leave this repo's CI red from birth, gating nothing.
      - run: npm install

      # BUILD FIRST. `@particle-academy/stripe-js` imports the node kinds from `@particle-academy/stripe-ui`, whose
      # `types` point at ./dist — which does not exist on a clean checkout. A
      # lint-then-build order fails every time and says nothing about the code.
      # `--workspaces` runs in root order, and ui is listed first.
      - run: npm run build --workspaces

      - run: npm run lint --workspaces
      - run: npm test --workspaces

  php:
    name: particle-academy/stripe-php
    runs-on: ubuntu-latest
    # From the ROOT: composer.json lives there, because Packagist reads the
    # repository's default branch and refuses a subdirectory package.
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
        env:
          update: true # latest patch, not the runner's preinstalled one
      - name: Floor PHP at the PHP2Shell-patched release (CVE-2026-109618/109619)
        run: php -r '$v=$argv[1]??PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION.".".PHP_RELEASE_VERSION; $f=["8.5"=>"8.5.12","8.4"=>"8.4.27","8.3"=>"8.3.36","8.2"=>"8.2.35"][implode(".",array_slice(explode(".",$v),0,2))]??(version_compare($v,"8.6",">=")?"8.6":"8.2.35"); if(version_compare($v,$f,"<")){echo "::error::PHP $v is below the PHP2Shell floor $f".PHP_EOL;exit(1);} echo "PHP $v >= PHP2Shell floor $f".PHP_EOL;'
      - run: composer install --no-interaction --prefer-dist
      - run: composer run lint
      - run: composer run test

  py:
    name: fancy-stripe
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/py
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install --upgrade pip build pytest ruff mypy
      # Install the BUILT package, not the working tree: under the default
      # import mode a missing py.typed or an unshipped file passes locally and
      # breaks for every user.
      - run: pip install .
      - run: ruff check .
      - run: mypy
      - run: pytest
