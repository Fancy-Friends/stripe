# GENERATED — from weaver's template/repo/.github/workflows/publish.yml.
# Fix it there and re-run `npm run provider -- stripe`; an edit here is
# destroyed by the next protocol sync.

name: Publish

# NEVER `pull_request` or `pull_request_target`: a fork's code running in this
# workflow would mint an OIDC token for THIS repo and publish as it. Under the
# old scope-wide token the same hole reached every @particle-academy package;
# Trusted Publishing narrows the blast radius to this repo's own packages and
# does not close it, so the trigger list is still the mitigation.
#
# `workflow_dispatch` does NOT reopen it — it requires write access to this
# repo and cannot be fired from a fork — and it is what makes the FIRST publish
# safe. That run is the only thing that proves the Trusted Publisher is
# configured FOR THIS PACKAGE: publishers are per package, so a green run for
# one says nothing about the next. Tagging all four into that run means
# discovering a gap four times.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Which package to publish. Use `ui` for the very first release: it has
          no first-party dependencies, whereas @particle-academy/stripe-js peer-depends on
          @particle-academy/stripe-ui at a minor RANGE, so a js published first sits there with an
          unsatisfied peer until ui lands at that minor. Confirm ui resolves on
          the registry before publishing the rest.
        type: choice
        default: ui
        options: [ui, js, php, py, all]

# What EVERY job needs, and nothing more. `id-token: write` is declared on the
# `npm` job alone — see there. Declaring it here would hand an OIDC identity for
# this repo to the PyPI and Packagist jobs as well, neither of which exchanges
# one, and a credential nobody uses is still a credential in reach of every
# action those jobs run.
permissions:
  contents: read

concurrency:
  group: publish-stripe
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # NOTHING here writes to git. The only `git push` in this file is
          # inside an echo, telling a human what to run. So the token checkout
          # leaves in .git/config for the life of the job has no use — and
          # every later step, and every action those steps call, can read it.
          persist-credentials: false

      # `GITHUB_REF_NAME` is the TAG on a push and the BRANCH on a dispatch.
      # Taking it blindly would compute a version of "main" for every manual
      # publish, grep CHANGELOG.md for `## [main]`, and refuse — including the
      # first release, which is the whole reason the dispatch exists.
      - name: Work out which version is being released
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version=$(node -p "require('./packages/ui/package.json').version")
            echo "Dispatched publish of '${{ inputs.only }}' at version ${version}."
          else
            version="${GITHUB_REF_NAME#v}"
            echo "Tagged release ${GITHUB_REF_NAME} -> version ${version}."
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # FIRST, before anything is built. A half-published version across three
      # registries cannot be taken back; a failed grep costs seconds.
      - name: A CHANGELOG entry for this version must exist
        run: |
          version="${{ steps.version.outputs.version }}"
          if ! grep -qE "^## \[?${version}\]?" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${version}."
            echo "A release nobody described is a release nobody can decide whether to take."
            exit 1
          fi

      - name: Fetch the third-party allowlist
        uses: actions/checkout@v5
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      # The same gate CI runs, run again at the tag. A dependency approved in
      # March and abandoned in June must not reach a registry in July.
      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      # The manifest is regenerated by weaver, so a tag that carries a hand-edit
      # under packages/ is caught before anything reaches a registry.
      - name: Verify the integrity manifest
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const fs = require("node:fs");

            const manifest = JSON.parse(fs.readFileSync(".weaver.json", "utf8"));
            const bad = Object.entries(manifest.files).filter(([file, expected]) =>
              !fs.existsSync(file) ||
              createHash("sha256").update(fs.readFileSync(file, "utf8"), "utf8").digest("hex") !== expected
            );

            if (bad.length) {
              console.error("::error::" + bad.length + " generated file(s) differ from what weaver emitted");
              for (const [file] of bad) console.error("  " + file);
              process.exit(1);
            }
          '

      - name: Every package must declare the version the tag claims
        run: |
          version="${{ steps.version.outputs.version }}"
          node -e '
            const fs = require("node:fs");
            const want = process.argv[1];
            const found = {
              ui: JSON.parse(fs.readFileSync("packages/ui/package.json", "utf8")).version,
              js: JSON.parse(fs.readFileSync("packages/js/package.json", "utf8")).version,
              py: /^version = "(.+)"$/m.exec(fs.readFileSync("packages/py/pyproject.toml", "utf8"))?.[1],
            };
            const wrong = Object.entries(found).filter(([, v]) => v !== want);
            if (wrong.length) {
              console.error(`::error::tag says ${want}, packages say ${JSON.stringify(found)}`);
              process.exit(1);
            }
          ' "$version"

  npm:
    name: npm
    needs: gate
    # Job-level permissions REPLACE the workflow block, they do not merge with
    # it — so `contents: read` is restated here rather than inherited. Dropping
    # it would break `actions/checkout` in this job only, which is the kind of
    # failure that looks like a runner problem.
    #
    # `id-token: write` is what makes npm Trusted Publishing work: the runner
    # exchanges a short-lived OIDC token for publish rights, and npm records
    # PROVENANCE against the workflow that ran.
    #
    # This used to say the opposite, and the reason was real at the time —
    # Trusted Publishers are configured per PACKAGE, and 46 of them is not a
    # setup anybody was going to do by hand. The owner has since had it done,
    # pointed at the Fancy-Friends repos, which is the org these workflows run
    # in and what npm checks `repository.url` against.
    #
    # PyPI is untouched. Its pending-publisher cap of three is still real and
    # the py job still uses a token.
    permissions:
      contents: read
      id-token: write
    # A tag releases all four together — the steady state. A dispatch releases
    # exactly one, which is what the first publish needs.
    if: >-
      github.event_name == 'push' ||
      inputs.only == 'all' || inputs.only == 'ui' || inputs.only == 'js'
    runs-on: ubuntu-latest
    strategy:
      # One at a time. A partial matrix failure across two registries is harder
      # to reason about than a stopped one.
      max-parallel: 1
      matrix:
        package: [ui, js]
    steps:
      - uses: actions/checkout@v5
        with:
          # NOTHING here writes to git. The only `git push` in this file is
          # inside an echo, telling a human what to run. So the token checkout
          # leaves in .git/config for the life of the job has no use — and
          # every later step, and every action those steps call, can read it.
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # PINNED, and neither half of the pin is fussiness.
      #
      # `setup-node` on node 22 bundles npm 10, and Trusted Publishing needs
      # 11.5+ — so the upgrade is mandatory, not a preference. `npm@latest` is
      # NOT the way to get it: self-replacement fails with
      # `MODULE_NOT_FOUND: promise-retry`. And npm 12.0.0 broke provenance for
      # the estate that set this up first, which is why the version is exact
      # rather than a range.
      #
      # `npx -y npm@11.18.0` rather than `npm i -g`: it sidesteps the
      # self-replacement path entirely.
      - run: node -e "console.log('bundled npm:', require('child_process').execSync('npm -v').toString().trim())"

      # From the ROOT: the workspace is what lets packages/js resolve packages/ui
      # before ui has ever been published. The matrix runs ui first and
      # `max-parallel: 1` keeps it that way, so by the time js publishes, ui is
      # on the registry for consumers — but this build never needed it to be.
      - run: npm install

      # Every workspace, not just this matrix leg: building js needs ui's dist,
      # and ui is listed first.
      - run: npm run build --workspaces

      - run: npm test --workspace packages/${{ matrix.package }}

      # Under a scope-wide token `npm publish` CREATED the package with no
      # per-package setup, and that was the entire reason for such a token.
      # Trusted Publishing inverts it: a publisher is configured PER PACKAGE, so
      # a package nobody set one up for cannot publish here at all — which is
      # what the failure branch below is written to say out loud.
      #
      # Skip the leg the dispatch did not ask for. `ui` first is not a
      # preference: @particle-academy/stripe-js peer-depends on @particle-academy/stripe-ui at a minor RANGE, so
      # publishing js first puts a package on npm whose peer is unsatisfied until
      # ui lands at that minor.
      # Idempotent BY CHECK, not by hope — the same rule submit-catalogs.mjs
      # applies to Packagist. A version already on the registry is skipped, so a
      # re-run after a half-finished release is safe rather than a second
      # incident, and a tag can follow a package-by-package first release.
      #
      # A LOOKUP FAILURE IS NOT A "NO": anything other than a clean hit or a
      # clean miss stops the job rather than publishing over an unknown state.
      - name: Publish
        if: >-
          github.event_name == 'push' || inputs.only == 'all' ||
          inputs.only == matrix.package
        working-directory: packages/${{ matrix.package }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name}/${version}")

          if [ "$status" = "200" ]; then
            echo "${name}@${version} is already on the registry — nothing to do."
            exit 0
          fi

          if [ "$status" != "404" ]; then
            echo "::error::npm answered ${status} for ${name}@${version}; refusing to guess."
            exit 1
          fi

          # `--provenance` is the point of the change: npm records WHICH
          # workflow in WHICH repo published this, and refuses if
          # `repository.url` does not match the OIDC source. Ours is
          # `git+https://github.com/Fancy-Friends/stripe.git`, emitted from friends.json,
          # so it matches by construction rather than by anyone remembering.
          #
          # `--access public` on EVERY publish, not just the first: a scoped
          # package defaults to restricted.
          #
          # NO `NODE_AUTH_TOKEN`. OIDC is exclusive — a token present beside it
          # is at best noise and at worst the thing that gets used, which would
          # publish without provenance and look like success.
          #
          # The failure branch is HERE and not in the confirm step below,
          # because a rejected publish fails THIS step and every later one is
          # skipped. The guidance lived down there for one commit and was
          # unreachable in the only case it was written for.
          if ! npx -y npm@11.18.0 publish --provenance --access public; then
            echo "::error::${name}@${version} was REFUSED by npm."
            echo
            echo "Publishing here uses npm Trusted Publishing (OIDC), and publishers are"
            echo "configured PER PACKAGE. The likeliest cause is that ${name} has no"
            echo "Trusted Publisher pointing at ${GITHUB_REPOSITORY} and this workflow"
            echo "file — a sibling package succeeding says nothing about this one."
            echo
            echo "Check it at: https://www.npmjs.com/package/${name}/access"
            echo
            echo "The other candidate is repository.url in package.json. Provenance"
            echo "REJECTS a publish whose repository.url does not match the OIDC source,"
            echo "and that failure arrives after everything else has passed."
            exit 1
          fi

      - name: Confirm it resolves on the registry
        if: >-
          github.event_name == 'push' || inputs.only == 'all' ||
          inputs.only == matrix.package
        working-directory: packages/${{ matrix.package }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")

          # The SAME endpoint the publish step checks before publishing.
          #
          # `npm view` reads the package-level document, which propagates LATER
          # than the version document — so it reported a fresh publish as
          # missing while `/<name>/<version>` already answered 200. Two sources
          # of truth for "does this exist" disagree exactly when it matters, and
          # here it turned a successful first publish into a red run.
          # TWENTY attempts at 30s = ten minutes, widened from 10x15s.
          #
          # `gmail-js` published cleanly WITH provenance and was still not on
          # the versioned endpoint inside 150 seconds, so the job went red over
          # a release that had entirely succeeded. Two of twenty-three releases
          # tripped this, and a red run that is actually a success is how a team
          # learns to ignore red.
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name}/${version}")

            if [ "$status" = "200" ]; then
              echo "${name}@${version} is on the registry."

              # And it carries PROVENANCE, which is the only thing that proves
              # this published through Trusted Publishing rather than falling
              # back to something else. Resolving proves a package exists; it
              # does not prove HOW it got there, and "the job was green" is not
              # evidence anywhere else in this repo either.
              #
              # Every package published under the old scope-wide token has no
              # `dist.attestations` at all — checked on the registry, not
              # assumed — so its absence here is a real signal and not a quirk
              # of the endpoint.
              curl -s "https://registry.npmjs.org/${name}/${version}" > /tmp/npm-version.json

              if ! node -e 'process.exit(JSON.parse(require("fs").readFileSync("/tmp/npm-version.json","utf8")).dist?.attestations ? 0 : 1)'; then
                echo "::error::${name}@${version} published WITHOUT provenance."
                echo
                echo "The package is on the registry, so this is not a publish failure —"
                echo "it is the publish having taken a path that does not attest. The"
                echo "point of Trusted Publishing is the attestation; without it this"
                echo "release is indistinguishable from one made with a token."
                echo
                echo "Do not re-run: ${version} exists and a re-run will skip it. The"
                echo "next release is where this gets corrected."
                exit 1
              fi

              echo "...with provenance."
              exit 0
            fi

            sleep 30
          done

          echo "::error::${name}@${version} published cleanly and is STILL not on the"
          echo "registry after TEN MINUTES."
          echo
          echo "Note what this is not: the publish step succeeded, so the Trusted"
          echo "Publisher is configured and provenance was accepted. Do not go looking"
          echo "at credentials — that error prints from the publish step, not here."
          echo
          echo "This is the versioned endpoint, which is normally the FIRST to answer."
          echo "Two and a half minutes without it is longer than any propagation lag"
          echo "observed on this org, so treat it as npm having a bad day and confirm"
          echo "by hand before re-running anything:"
          echo "    npm view ${name}@${version}"
          echo
          echo "Do NOT re-dispatch to 'fix' it. The version is published; a second run"
          echo "reads 200 and skips, or races the first."
          exit 1

  pypi:
    name: PyPI
    needs: gate
    if: >-
      github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'py'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/py
    steps:
      - uses: actions/checkout@v5
        with:
          # NOTHING here writes to git. The only `git push` in this file is
          # inside an echo, telling a human what to run. So the token checkout
          # leaves in .git/config for the life of the job has no use — and
          # every later step, and every action those steps call, can read it.
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install --upgrade pip build twine pytest
      - run: pip install .
      - run: pytest
      - run: python -m build

      # `twine upload` creates the project on first upload. The token is
      # account-scoped for the same reason npm's is scope-wide: a project-scoped
      # token cannot create a project that does not exist yet.
      - name: Upload unless this version is already there
        run: |
          name=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          # The PEP 691 SIMPLE INDEX, which is what an installer actually reads.
          #
          # Not `pypi.org/pypi/<name>/<version>/json`: that endpoint lags badly
          # for a newly created project — it answered 404 for fancy-stripe 0.1.0
          # for minutes after a successful upload, while the package document
          # already listed the version. A pre-check on it would have been a
          # permanent no-op, always attempting an upload and always failing on
          # the second run with "file already exists".
          accept='Accept: application/vnd.pypi.simple.v1+json'
          url="https://pypi.org/simple/${name}/"

          status=$(curl -s -o /tmp/pypi-index.json -w '%{http_code}' -H "$accept" "$url")

          if [ "$status" = "200" ]; then
            if python -c "import json,sys;sys.exit(0 if sys.argv[1] in json.load(open('/tmp/pypi-index.json'))['versions'] else 1)" "$version"; then
              echo "${name} ${version} is already on PyPI — nothing to do."
              exit 0
            fi
          elif [ "$status" != "404" ]; then
            # A failed lookup is not a "no".
            echo "::error::PyPI answered ${status} for ${name}; refusing to guess."
            exit 1
          fi

          # A bare "429 Too Many Requests" is a failure nobody can act on: twine
          # prints the status and throws the BODY away, and PyPI puts the actual
          # reason there — which limit, and often for how long. So on a failure,
          # ask the endpoint directly and print what it says.
          #
          # `-u` sends the credential in an Authorization header curl never
          # echoes; only the status and body are printed.
          if ! twine upload dist/*; then
            echo "::group::What PyPI actually said"
            code=$(curl -sS -o /tmp/pypi-error.txt -w '%{http_code}'               -X POST https://upload.pypi.org/legacy/               -u "__token__:${TWINE_PASSWORD}"               -F ":action=file_upload" -F "protocol_version=1" || echo "000")
            echo "HTTP ${code}"
            head -c 2000 /tmp/pypi-error.txt
            echo
            echo "::endgroup::"

            # The REAL upload again, verbosely. twine prints only the reason
            # phrase — "Too Many Requests" — and DISCARDS the HTML body, which
            # is where PyPI says which limit was hit. That distinction is the
            # whole diagnosis, so it is captured rather than inferred.
            echo "::group::The failing upload, verbosely"
            twine upload --verbose dist/* > /tmp/pypi-verbose.txt 2>&1 || true
            cat /tmp/pypi-verbose.txt
            echo "::endgroup::"

            if grep -qi "Too many new projects created" /tmp/pypi-verbose.txt; then
              echo "::error::PyPI refused to create a NEW PROJECT — its rate limit, not this package."
              echo
              echo "PyPI meters project CREATION with two limiters, and warehouse's"
              echo "own defaults are:"
              echo "    project.create.user   20 per hour"
              echo "    project.create.ip     40 per hour"
              echo
              echo "The per-IP one is the usual culprit here: GitHub Actions runners"
              echo "share a pool of addresses with everyone else publishing to PyPI, so"
              echo "the 40/hour can be exhausted by strangers. Nothing is wrong with the"
              echo "token, the metadata or the upload — a version of an EXISTING project"
              echo "would go straight through."
              echo
              echo "Do NOT retry in a tight loop: each attempt consumes budget whether it"
              echo "succeeds or not, which keeps the window full."
              echo
              echo "Either wait and re-dispatch this workflow with only=py, or upload once"
              echo "from a machine on a different address:"
              echo "    cd packages/py && python -m build && twine upload dist/*"
            fi

            exit 1
          fi
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  packagist:
    name: Packagist
    needs: gate
    if: >-
      github.event_name == 'push' || inputs.only == 'all' || inputs.only == 'php'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # NOTHING here writes to git. The only `git push` in this file is
          # inside an echo, telling a human what to run. So the token checkout
          # leaves in .git/config for the life of the job has no use — and
          # every later step, and every action those steps call, can read it.
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      # From the ROOT — see ci.yml.
      - run: |
          composer install --no-interaction --prefer-dist
          composer run test

      # THE ORDER IS THE WHOLE STEP: publish, push the tag, THEN register.
      #
      # Packagist reads versions from git TAGS, and it crawls a newly-registered
      # package once, immediately. Register before the tag exists and that first
      # crawl finds nothing — the package resolves, carries zero versions, and
      # will not be looked at again until Packagist's own schedule comes round,
      # which is hours. `composer require` fails the whole time with "could not
      # find package", and the job that caused it reported success.
      #
      # That is what a package-by-package first release does by default, because
      # the dispatch runs before anything is tagged. So this step DEFERS rather
      # than registering early: pushing `v<version>` re-fires this workflow on
      # the tag trigger, and the registration then happens in the right order.
      - name: Register on Packagist, but only once the tag it reads exists
        run: |
          name='particle-academy/stripe-php'
          version=$(node -p "require('./packages/ui/package.json').version")
          tag="v${version}"

          # One version across all four packages — the CHANGELOG says so — so
          # the ui package.json is as good a source as any and needs no PHP.
          if [ -z "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "${tag} does not exist yet, so Packagist would register ${name} with"
            echo "no versions and not look again for hours. Deferring."
            echo
            echo "Push the tag and this workflow runs again in the right order:"
            echo "    git tag -a ${tag} -m '${tag}' && git push origin ${tag}"
            exit 0
          fi

          status=$(curl -s -o /dev/null -w '%{http_code}' "https://repo.packagist.org/p2/${name}.json")

          if [ "$status" != "200" ] && [ "$status" != "404" ]; then
            # A failed lookup is NOT a "no". Re-submitting on every transient
            # blip is the same shape as a failed lookup counting as "up to date".
            echo "::error::Packagist answered ${status} for ${name}; refusing to guess."
            exit 1
          fi

          # ASK FOR THE CRAWL. Both paths need this, and that is the correction
          # monday.com's release bought: the tag was pushed BEFORE
          # `create-package`, exactly as the rule says, and the version still did
          # not appear — seven minutes of polling and an empty `p2`. An
          # `update-package` request made it resolve instantly.
          #
          # So registering in the right order is NECESSARY AND NOT SUFFICIENT.
          # Packagist's crawl-on-registration is asynchronous and slower than any
          # window worth waiting in, and "the rule was followed and it still
          # failed" is the reading that sends somebody looking at a credential
          # that was fine. `update-package` is classed SAFE, so either token works.
          ask_for_a_crawl() {
            code=$(curl -sS -o /tmp/packagist.json -w '%{http_code}' \
              -X POST https://packagist.org/api/update-package \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${{ secrets.PACKAGIST_USERNAME }}:${{ secrets.PACKAGIST_TOKEN }}" \
              -d "{\"repository\":{\"url\":\"https://github.com/Fancy-Friends/stripe\"}}")

            echo "Packagist answered ${code} to an update request: $(cat /tmp/packagist.json)"
          }

          if [ "$status" = "200" ]; then
            # Registered already — so this is a later release, or the recovery
            # path for one registered before its first tag existed.
            ask_for_a_crawl
            exit 0
          fi

          # KEEP THE BODY. Packagist answers 406 for BOTH "already exists" and
          # "missing or invalid username/apiToken", and 403 for a SAFE token
          # rather than the main one. The status alone cannot tell those apart in
          # either direction — `curl -f` discarded the body and a real failure
          # arrived as `curl: (22) ... error: 406` and nothing else.
          #
          # `create-package` is classed UNSAFE by Packagist, so it needs the MAIN
          # API token rather than a safe one.
          code=$(curl -sS -o /tmp/packagist.json -w '%{http_code}' \
            -X POST https://packagist.org/api/create-package \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${{ secrets.PACKAGIST_USERNAME }}:${{ secrets.PACKAGIST_TOKEN }}" \
            -d "{\"repository\":\"https://github.com/Fancy-Friends/stripe\"}")

          body=$(cat /tmp/packagist.json)
          echo "Packagist answered ${code}: ${body}"

          case "$(echo "$body" | tr '[:upper:]' '[:lower:]')" in
            *"already exists"*|*"already been"*|*duplicate*)
              echo "${name} was already registered — nothing to do."
              exit 0
              ;;
            *username*|*apitoken*|*credential*)
              echo "::error::Packagist rejected the CREDENTIAL (HTTP ${code})."
              echo "The API wants 'username:token', so a wrong PACKAGIST_USERNAME fails"
              echo "identically to a wrong token. Check both:"
              echo "  gh secret set PACKAGIST_USERNAME --org Fancy-Friends --visibility all"
              echo "  gh secret set PACKAGIST_TOKEN --org Fancy-Friends --visibility all"
              exit 1
              ;;
            *"not allowed"*|*unsafe*)
              echo "::error::This is a SAFE Packagist token, not the main one (HTTP ${code})."
              echo "create-package is classed UNSAFE and refuses a safe token — it reads"
              echo "like a permissions problem and is not. Take the MAIN token from"
              echo "https://packagist.org/profile/ ('Show API Token'), then:"
              echo "  gh secret set PACKAGIST_TOKEN --org Fancy-Friends --visibility all"
              exit 1
              ;;
          esac

          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo "${name} registered."
            ask_for_a_crawl
            exit 0
          fi

          echo "::error::Packagist answered ${code} and the body matched nothing known: ${body}"
          exit 1

      # The npm job confirms the VERSION resolves rather than trusting a green
      # publish, and the same reasoning applies here twice over: Packagist can
      # answer 200 for a package that carries no versions at all, which is the
      # exact state a too-early registration leaves behind. "The package exists"
      # is not the question anybody is asking — `composer require` wants a
      # version.
      - name: Confirm the version resolves on Packagist
        run: |
          name='particle-academy/stripe-php'
          version=$(node -p "require('./packages/ui/package.json').version")
          tag="v${version}"

          if [ -z "$(git ls-remote --tags origin "refs/tags/${tag}")" ]; then
            echo "${tag} is not pushed yet, so there is no version to confirm."
            exit 0
          fi

          # TWENTY attempts at 30s = ten minutes, widened from 10x15s, with a
          # SECOND crawl request halfway.
          #
          # stripe v0.3.2 was on Packagist minutes after this step gave up at
          # 150 seconds. The crawl is asynchronous and a request can sit behind
          # others, so asking AGAIN is worth more than only waiting longer.
          for attempt in $(seq 1 20); do
            if curl -s "https://repo.packagist.org/p2/${name}.json" \
              | tr ',' '\n' | grep -q "\"version\":\"${tag}\""; then
              echo "${name} ${tag} resolves on Packagist."
              exit 0
            fi

            if [ "$attempt" = "10" ]; then
              echo "Five minutes without it — asking Packagist for another crawl."
              code=$(curl -sS -o /tmp/packagist-recrawl.json -w '%{http_code}' \
                -X POST https://packagist.org/api/update-package \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${{ secrets.PACKAGIST_USERNAME }}:${{ secrets.PACKAGIST_TOKEN }}" \
                -d "{\"repository\":{\"url\":\"https://github.com/Fancy-Friends/stripe\"}}")
              echo "Packagist answered ${code}: $(cat /tmp/packagist-recrawl.json)"
            fi

            sleep 30
          done

          echo "::error::${name} does not carry ${tag} on Packagist after TEN MINUTES,"
          echo "across TWO crawl requests."
          echo
          echo "What this is NOT: a publish failure. Packagist reads versions from git"
          echo "TAGS, and the tag is pushed — so nothing is wrong with the package, the"
          echo "token, or this workflow. Do not go looking at credentials."
          echo
          echo "If the package was registered BEFORE the tag was pushed, its first"
          echo "crawl found no versions and the scheduled one is hours away. Check"
          echo "whether it has since landed before doing anything:"
          echo "    curl -s https://repo.packagist.org/p2/${name}.json | grep -o 'v[0-9.]*'"
          echo
          echo "If it has, this was propagation and there is nothing to fix. If it has"
          echo "not, re-running this workflow is safe and is the fix."
          exit 1
