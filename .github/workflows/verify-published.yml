# GENERATED — from weaver's template/repo/.github/workflows/verify-published.yml.
# Fix it there and re-run `npm run provider -- stripe`; an edit here is
# destroyed by the next protocol sync.

name: Verify published

# Runs against the PUBLISHED artifacts, installed BY NAME into throwaway
# projects that have never seen this repo.
#
# `ci.yml` proves the source works. It cannot prove the PACKAGING works: every
# test in this repo imports from `../src`, so a missing `files` entry, an
# unshipped module, an `exports` map that does not resolve or a wheel without
# `py.typed` all pass a green suite and break for every consumer.
#
# That is not hypothetical. `@particle-academy/fancy-flow` shipped `/engine`
# without exporting a type its own source declared, and it reached two
# marketplace nodes — because every test in that repo imports from `src`.
on:
  schedule:
    # 04:23 UTC, after the token canary. Not on the hour: every scheduled
    # workflow on GitHub fires there, and the queue at :00 is where a nightly
    # job goes to be an hour late.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-published-stripe
  cancel-in-progress: false

jobs:
  npm:
    name: "@particle-academy/stripe-js + @particle-academy/stripe-ui"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # A directory OUTSIDE the checkout, with no package.json of its own until
      # `npm init` makes one. Installing into the repo would resolve the
      # workspace and quietly test the working tree instead.
      - name: Install the published packages into a fresh project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm pkg set type=module
          npm install @particle-academy/stripe-js @particle-academy/fancy-flow --no-audit --no-fund

      # COPIED IN, not run across from the checkout. Node resolves a bare
      # specifier from the importing MODULE's directory, so running it in place
      # would resolve out of the repo's own node_modules and quietly test the
      # source again. The script asserts that too, but copying is the fix.
      - name: Use them the way a consumer would
        run: |
          cd "$RUNNER_TEMP/consumer"
          cp "$GITHUB_WORKSPACE/verify/published.mjs" .
          node ./published.mjs

  pypi:
    name: "fancy-stripe"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor and the newest, because a wheel that only works on one of
        # them is a wheel whose `requires-python` is a claim nobody checked.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the published wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/pip" install fancy-stripe

      - name: Use it the way a consumer would
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" "$GITHUB_WORKSPACE/verify/published.py"

  packagist:
    name: "particle-academy/stripe-php"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Require the published package into a fresh project
        run: |
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          composer require particle-academy/stripe-php --no-interaction

      - name: Use it the way a consumer would
        run: |
          cd "$RUNNER_TEMP/consumer"
          php -d zend.assertions=1 -d assert.exception=1 "$GITHUB_WORKSPACE/verify/published.php"

  # Every runtime asserts the SAME goldens, so all three passing means three
  # SEPARATELY BUILT, SEPARATELY PUBLISHED artifacts agree byte for byte. That
  # is the claim the four-package model rests on, and cross-runtime drift does
  # not fail loudly on its own — it completes, down one path, with no error.
  parity:
    name: all three published artifacts agree
    runs-on: ubuntu-latest
    needs: [npm, pypi, packagist]
    steps:
      - run: |
          echo "npm, PyPI and Packagist each reproduced the same golden payloads."
          echo "Three separately published artifacts, byte for byte."
